<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADDAM COINS BAZAR - Rare Coins Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fa;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: white;
            color: #667eea;
        }

        .search-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .coin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .coin-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            position: relative;
        }

        .coin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .coin-card.hidden {
            display: none;
        }

        .coin-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .coin-body {
            padding: 20px;
        }

        .rare-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: none;
        }

        .rare-badge.show {
            display: inline-block;
        }

        .coin-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .coin-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .coin-price {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-whatsapp {
            display: inline-block;
            width: 100%;
            padding: 10px;
            background: #25d366;
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .btn-whatsapp:hover {
            background: #1eaa4f;
            transform: translateY(-2px);
        }

        .footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        .footer p {
            margin: 8px 0;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
            font-weight: 600;
            font-size: 18px;
        }

        .no-coins {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 24px;
            }

            .coin-container {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .header-buttons {
                gap: 8px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>💰 SADDAM COINS BAZAR</h1>
        <p>Numismatics Expert & Digital Creator</p>
        <div class="header-buttons">
            <a href="#" class="btn btn-primary">🛍️ Browse Coins</a>
            <a href="upload.html" class="btn btn-secondary">📤 Upload Coin</a>
            <a href="#" class="btn btn-secondary">💬 Ask AI Bot</a>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input 
                type="text" 
                id="coinSearch" 
                placeholder="Search coins... (e.g., 1985, Rupee, Rare)" 
                onkeyup="filterCoins()"
            >
        </div>
        <p style="font-size: 12px; color: #999; margin-top: 8px;">💡 Search by name, year, or mint</p>
    </div>

    <div class="coin-container" id="coinContainer">
        <div class="loading">Loading coins...</div>
    </div>

    <div class="footer">
        <strong>SADDAM MD SADDAM</strong><br>
        Bihar (Bhagalpur & Banka) Regional Database<br>
        © 2026 "ONLINE KAMAI KI MASTER GUIDE" Project
    </div>

    <!-- 🤖 CHATBASE WIDGET -->
    <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="rvom3Sd33J6zgi1Y0-9G6";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script>
        // 🔎 SEARCH FUNCTION
        function filterCoins() {
            let input = document.getElementById('coinSearch').value.toLowerCase();
            let cards = document.querySelectorAll('.coin-card');
            
            cards.forEach(card => {
                let coinName = card.getAttribute('data-name');
                let coinYear = card.getAttribute('data-year');
                let coinMint = card.getAttribute('data-mint');
                
                let matches = 
                    coinName.includes(input) || 
                    coinYear.includes(input) || 
                    coinMint.includes(input);
                
                card.classList.toggle('hidden', !matches);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCL7WCpon9zMwXIPKXVJgmBJy5i4SAiufc",
            authDomain: "saddam-coin-bajar.firebaseapp.com",
            projectId: "saddam-coin-bajar",
            storageBucket: "saddam-coin-bajar.firebasestorage.app",
            messagingSenderId: "579582174932",
            appId: "1:579582174932:web:3f8469d68a073190f9bd41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('coinContainer');

        // Real-time listener for coins
        onSnapshot(collection(db, 'coins'), (snapshot) => {
            if (snapshot.empty) {
                container.innerHTML = '<div class="no-coins">No coins found. <a href="upload.html">Upload your first coin!</a></div>';
                return;
            }

            let html = '';
            
            snapshot.forEach((doc) => {
                const coin = doc.data();
                const badgeClass = coin.tag ? 'show' : '';
                
                html += `
                    <div class="coin-card" data-name="${coin.name.toLowerCase()}" data-year="${coin.year}" data-mint="${coin.mint.toLowerCase()}">
                        <img src="${coin.image}" alt="${coin.name}" class="coin-image">
                        <span class="rare-badge ${badgeClass}">${coin.tag}</span>
                        <div class="coin-body">
                            <div class="coin-title">${coin.name}</div>
                            <div class="coin-meta">Year: ${coin.year}</div>
                            <div class="coin-meta">Mint: ${coin.mint}</div>
                            <div class="coin-price">Kimat: ${coin.price}</div>
                            <a href="https://wa.me/91${coin.whatsapp}?text=Hi, interested in ${coin.name}" class="btn-whatsapp">💬 Contact on WhatsApp</a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }, (error) => {
            console.error('Error loading coins:', error);
            container.innerHTML = '<div class="no-coins">Error loading coins. Please try again.</div>';
        });
    </script>
</body>
</html>
