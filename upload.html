<!DOCTYPE html>
<html>
<head>
<title>Upload Coins</title>
</head>
<body>

<h1>Uploading Coins...</h1>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCL7WCpon9zMwXIPKXVJgmBJy5i4SAiufc",
  authDomain: "saddam-coin-bajar.firebaseapp.com",
  projectId: "saddam-coin-bajar",
  storageBucket: "saddam-coin-bajar.firebasestorage.app",
  messagingSenderId: "579582174932",
  appId: "1:579582174932:web:3f8469d68a073190f9bd41"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const coins = [];

for (let i = 1; i <= 1000; i++) {
  coins.push({
    name: "Rare Coin " + i,
    mint: "India",
    price: "₹" + (i * 10),
    rare: i % 2 === 0
  });
}

async function uploadCoins() {
  for (const coin of coins) {
    await addDoc(collection(db, "coins"), coin);
    console.log("Uploaded:", coin.name);
  }
  document.body.innerHTML = "<h1>✅ 1000 Coins Uploaded Successfully!</h1>";
}

uploadCoins();
</script>

</body>
</html>
