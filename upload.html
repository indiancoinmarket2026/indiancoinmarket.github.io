<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Coin - Saddam Coins Bazar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #667eea;
            color: white;
        }

        #imagePreview {
            margin-top: 15px;
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
            font-weight: 600;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Upload Coin</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="coinName">Coin Name *</label>
                <input type="text" id="coinName" placeholder="e.g., 1 Rupee 1985 (H Mark)" required>
            </div>

            <div class="form-group">
                <label for="coinYear">Year *</label>
                <input type="number" id="coinYear" placeholder="e.g., 1985" required>
            </div>

            <div class="form-group">
                <label for="coinMint">Mint *</label>
                <input type="text" id="coinMint" placeholder="e.g., Heaton Press" required>
            </div>

            <div class="form-group">
                <label for="coinTag">Tag/Rarity</label>
                <select id="coinTag">
                    <option value="">None</option>
                    <option value="RARE">RARE</option>
                    <option value="UNCOMMON">UNCOMMON</option>
                    <option value="COMMON">COMMON</option>
                </select>
            </div>

            <div class="form-group">
                <label for="coinPrice">Price Range *</label>
                <input type="text" id="coinPrice" placeholder="e.g., ₹500 - ₹2,500" required>
            </div>

            <div class="form-group">
                <label for="coinImage">Coin Image *</label>
                <div class="file-input-wrapper">
                    <input type="file" id="coinImage" accept="image/*" required>
                    <label for="coinImage" class="file-input-label">
                        📷 Click to upload image
                    </label>
                </div>
                <img id="imagePreview" alt="Preview">
            </div>

            <button type="submit">Upload Coin 🚀</button>
        </form>

        <div class="loading" id="loading">Uploading... Please wait</div>
        <div class="message" id="message"></div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <!-- 🤖 CHATBASE WIDGET -->
    <script>
    (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="rvom3Sd33J6zgi1Y0-9G6";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCL7WCpon9zMwXIPKXVJgmBJy5i4SAiufc",
            authDomain: "saddam-coin-bajar.firebaseapp.com",
            projectId: "saddam-coin-bajar",
            storageBucket: "saddam-coin-bajar.firebasestorage.app",
            messagingSenderId: "579582174932",
            appId: "1:579582174932:web:3f8469d68a073190f9bd41"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const fileInput = document.getElementById('coinImage');
        const imagePreview = document.getElementById('imagePreview');
        const uploadForm = document.getElementById('uploadForm');
        const loadingDiv = document.getElementById('loading');
        const messageDiv = document.getElementById('message');

        // Image preview
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Upload form
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const coinName = document.getElementById('coinName').value;
            const coinYear = document.getElementById('coinYear').value;
            const coinMint = document.getElementById('coinMint').value;
            const coinTag = document.getElementById('coinTag').value;
            const coinPrice = document.getElementById('coinPrice').value;
            const coinImage = fileInput.files[0];

            if (!coinImage) {
                showMessage('Please select an image', 'error');
                return;
            }

            loadingDiv.style.display = 'block';
            messageDiv.style.display = 'none';

            try {
                // Upload image
                const storageRef = ref(storage, `coins/${Date.now()}_${coinImage.name}`);
                const snapshot = await uploadBytes(storageRef, coinImage);
                const imageUrl = await getDownloadURL(snapshot.ref);

                // Save to Firestore
                await addDoc(collection(db, 'coins'), {
                    name: coinName,
                    year: parseInt(coinYear),
                    mint: coinMint,
                    tag: coinTag,
                    price: coinPrice,
                    image: imageUrl,
                    createdAt: new Date(),
                    whatsapp: "918923456789"
                });

                loadingDiv.style.display = 'none';
                showMessage('✅ Coin uploaded successfully!', 'success');
                uploadForm.reset();
                imagePreview.style.display = 'none';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                loadingDiv.style.display = 'none';
                showMessage('❌ Error uploading coin: ' + error.message, 'error');
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }
    </script>
</body>
</html>
