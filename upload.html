<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Coin - Saddam Coins Bazar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #667eea;
            color: white;
        }

        #imagePreview {
            margin-top: 15px;
            max-width: 100%;
            height: 200px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* 🔥 AI SECURITY ALERT BOX STYLE 🔥 */
        .ai-status-box {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        .ai-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .ai-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
        }
        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Upload Coin</h1>

        <div id="aiShieldBox" class="ai-status-box"></div>

        <form id="uploadForm" onsubmit="return startAIShieldCheck(event)">
            <div class="form-group">
                <label for="coinName">Coin Name *</label>
                <input type="text" id="coinName" placeholder="e.g., 1 Rupee 1985 (H Mark)" required>
            </div>

            <div class="form-group">
                <label for="coinYear">Year *</label>
                <input type="number" id="coinYear" placeholder="e.g., 1985" min="1500" max="2026" required>
            </div>

            <div class="form-group">
                <label for="coinMint">Mint *</label>
                <input type="text" id="coinMint" placeholder="e.g., Heaton Press, Noida, Mumbai" required>
            </div>

            <div class="form-group">
                <label for="coinRarity">Tag/Rarity *</label>
                <select id="coinRarity">
                    <option value="None">None</option>
                    <option value="Rare">Rare</option>
                    <option value="Very Rare">Very Rare</option>
                    <option value="Extremely Rare">Extremely Rare</option>
                </select>
            </div>

            <div class="form-group">
                <label for="coinPrice">Price Range (INR) *</label>
                <input type="number" id="coinPrice" placeholder="e.g., 2500" required>
            </div>

            <div class="form-group">
                <label>Coin Image *</label>
                <div class="file-input-wrapper">
                    <label class="file-input-label" id="fileLabel">📸 Click to upload image</label>
                    <input type="file" id="coinImage" accept="image/*" required onchange="showPreview(this)">
                </div>
                <img id="imagePreview" alt="Coin Preview">
            </div>

            <button type="submit">Upload Coin 🚀</button>
        </form>
    </div>

    <a href="index.html" class="back-home">← Back to Home</a>

    <script>
        // गलत और अश्लील शब्दों की सूची (AI Filter List)
        const blockListWords = ["fraud", "fake", "scam", "chutiya", "gand", "saala", "sexy", "cheat", "froot"];

        // इमेज का प्रीव्यू दिखाने के लिए फंक्शन
        function showPreview(input) {
            const preview = document.getElementById('imagePreview');
            const label = document.getElementById('fileLabel');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    label.innerHTML = "✅ Image Selected: " + input.files[0].name;
                    label.style.background = "#e6fffa";
                    label.style.borderColor = "#319795";
                    label.style.color = "#319795";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // AI वैलिडेशन चेक करने वाला मुख्य फंक्शन
        function startAIShieldCheck(event) {
            event.preventDefault(); // फॉर्म को सबमिट होने से रोकें

            const shieldBox = document.getElementById('aiShieldBox');
            const name = document.getElementById('coinName').value.toLowerCase();
            const mint = document.getElementById('coinMint').value.toLowerCase();
            const price = parseFloat(document.getElementById('coinPrice').value);
            const fileInput = document.getElementById('coinImage').files[0];

            shieldBox.style.display = "block";
            shieldBox.className = "ai-status-box ai-error"; // डिफ़ॉल्ट रूप से एरर सेट करें

            // 🔍 AI चेक 1: अश्लील और गलत शब्दों का फिल्टर
            for (let word of blockListWords) {
                if (name.includes(word) || mint.includes(word)) {
                    shieldBox.innerHTML = "⚠️ <b>AI Security Alert:</b> Form mein galat ya apmanjanak shabdon ka istemal mila hai! Kripya sahi jankari bharein.";
                    return false;
                }
            }

            // 🔍 AI चेक 2: फर्जी कीमतों पर रोक (अधिकतम ₹2,00,000)
            if (price > 200000) {
                shieldBox.innerHTML = "⚠️ <b>AI Price Security:</b> Kimat bahut zyada (₹2 Lakh se upar) hai! Saddam Coins Bazar par fake prices daalna mana hai.";
                return false;
            }
            if (price <= 0) {
                shieldBox.innerHTML = "⚠️ <b>AI Price Security:</b> Kimat ₹0 ya minus mein nahi ho sakti!";
                return false;
            }

            // 🔍 AI चेक 3: फाइल टाइप सिक्योरिटी चेक
            if (fileInput) {
                const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg'];
                if (!allowedTypes.includes(fileInput.type)) {
                    shieldBox.innerHTML = "⚠️ <b>AI File Security:</b> Aap sirf Photos (.jpg, .png) ही अपलोड कर सकते हैं!";
                    return false;
                }
            }

            // 🟢 अगर सारे टेस्ट पास हो गए तो AI हरी झंडी देगा
            shieldBox.className = "ai-status-box ai-success";
            shieldBox.innerHTML = "🤖 <b>Saddam AI Verified!</b> Sab jankari paki hai. WhatsApp connect ho raha hai...";

            // डेटा को आपके नंबर पर भेजने की तैयारी
            setTimeout(() => {
                const myWhatsAppNumber = "917606829390"; // आपका पर्सनल नंबर
                const textMessage = `🪙 *NEW COIN UPLOAD REQUEST* 🪙\n\n` +
                                    `• *Coin Name:* ${document.getElementById('coinName').value}\n` +
                                    `• *Year:* ${document.getElementById('coinYear').value}\n` +
                                    `• *Mint Mark:* ${document.getElementById('coinMint').value}\n` +
                                    `• *Rarity:* ${document.getElementById('coinRarity').value}\n` +
                                    `• *Price:* ₹${price}\n\n` +
                                    `📱 _Saddam Bhai, AI ne verify kar diya hai. Is sikke ko live kijiye!_`;
                
                const finalUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(textMessage)}`;
                window.open(finalUrl, '_blank');
            }, 1200);

            return true;
        }
    </script>
</body>
</html>
