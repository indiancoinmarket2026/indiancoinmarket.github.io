<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Coin - Saddam Coins Bazar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            margin: 20px 0;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #667eea;
            color: white;
        }

        #imagePreview {
            margin-top: 15px;
            max-width: 100%;
            height: 180px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* 🔥 AI ALERT BOX DESIGN */
        .ai-status-box {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        .ai-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .ai-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
        }
        .back-home:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Multi-Vendor Upload</h1>
        <p class="subtitle">Saddam AI Security Shield Protected 🤖</p>

        <div id="aiShieldBox" class="ai-status-box"></div>

        <form id="uploadForm" onsubmit="return startAIShieldCheck(event)">
            
            <div class="form-group">
                <label for="sellerName">Aapka Naam (Seller Name) *</label>
                <input type="text" id="sellerName" placeholder="e.g., Rahul Kumar" required>
            </div>

            <div class="form-group">
                <label for="sellerPhone">Aapka WhatsApp Number *</label>
                <input type="number" id="sellerPhone" placeholder="e.g., 9876XXXXXX" required>
            </div>

            <div class="form-group">
                <label for="coinName">Coin Name *</label>
                <input type="text" id="coinName" placeholder="e.g., 1 Rupee 1985 (H Mark)" required>
            </div>

            <div class="form-group">
                <label for="coinYear">Year *</label>
                <input type="number" id="coinYear" placeholder="e.g., 1985" min="1500" max="2026" required>
            </div>

            <div class="form-group">
                <label for="coinMint">Mint Mark *</label>
                <input type="text" id="coinMint" placeholder="e.g., Heaton Press, Mumbai, Noida" required>
            </div>

            <div class="form-group">
                <label for="coinCondition">Coin Condition *</label>
                <select id="coinCondition">
                    <option value="UNC (Bilkul Chamचमाता Naya)">UNC (Bilkul Chamchamata Naya)</option>
                    <option value="Very Fine (Acchi Haalat Me)">Very Fine (Acchi Haalat Me)</option>
                    <option value="Fine (Thoda Ghisa Hua)">Fine (Thoda Ghisa Hua)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="coinRarity">Rarity Tag *</label>
                <select id="coinRarity">
                    <option value="None">None (Normal Sikka)</option>
                    <option value="Rare">Rare (Durlabh)</option>
                    <option value="Very Rare">Very Rare</option>
                    <option value="Extremely Rare">Extremely Rare</option>
                </select>
            </div>

            <div class="form-group">
                <label for="coinPrice">Aapki Kimat (Price INR) *</label>
                <input type="number" id="coinPrice" placeholder="e.g., 2500" required>
            </div>

            <div class="form-group">
                <label for="coinDesc">Sikke Ki Jankari (Description) *</label>
                <textarea id="coinDesc" placeholder="Sikke ke baare me kuch batayein..." required></textarea>
            </div>

            <div class="form-group">
                <label>Coin Clear Image *</label>
                <div class="file-input-wrapper">
                    <label class="file-input-label" id="fileLabel">📸 Click to upload image</label>
                    <input type="file" id="coinImage" accept="image/*" required onchange="showPreview(this)">
                </div>
                <img id="imagePreview" alt="Coin Preview">
            </div>

            <button type="submit">Verify & Request Upload 🚀</button>
        </form>
    </div>

    <a href="index.html" class="back-home">← Back to Home</a>

    <script>
        // AI ब्लॉकलिस्ट वर्ड्स
        const blockListWords = ["fraud", "fake", "scam", "chutiya", "gand", "saala", "sexy", "cheat", "froot", "lutera", "loot"];

        function showPreview(input) {
            const preview = document.getElementById('imagePreview');
            const label = document.getElementById('fileLabel');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    label.innerHTML = "✅ Photo Selected";
                    label.style.background = "#e6fffa";
                    label.style.borderColor = "#319795";
                    label.style.color = "#319795";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function startAIShieldCheck(event) {
            event.preventDefault();

            const shieldBox = document.getElementById('aiShieldBox');
            const sellerName = document.getElementById('sellerName').value.toLowerCase();
            const name = document.getElementById('coinName').value.toLowerCase();
            const mint = document.getElementById('coinMint').value.toLowerCase();
            const desc = document.getElementById('coinDesc').value.toLowerCase();
            const price = parseFloat(document.getElementById('coinPrice').value);
            const fileInput = document.getElementById('coinImage').files[0];

            shieldBox.style.display = "block";
            shieldBox.className = "ai-status-box ai-error";

            // 🔍 AI स्कैन 1: गाली और फ्रॉड शब्दों का फिल्टर (हर फील्ड में)
            const fullTextContent = `${sellerName} ${name} ${mint} ${desc}`;
            for (let word of blockListWords) {
                if (fullTextContent.includes(word)) {
                    shieldBox.innerHTML = "⚠️ <b>AI Security Block:</b> Form mein galat, apmanjanak ya fraud shabdon ka istemal mila hai! Kripya sahi jankari likhein.";
                    return false;
                }
            }

            // 🔍 AI स्कैन 2: फर्जी और मजाक वाली भारी कीमतों पर रोक
            if (price > 200000) {
                shieldBox.innerHTML = "⚠️ <b>AI Price Block:</b> Kimat ₹2,00,000 se zyada daalna mana hai. Kripya sahi kimat bharein.";
                return false;
            }
            if (price <= 0) {
                shieldBox.innerHTML = "⚠️ <b>AI Price Block:</b> Kimat ₹0 se zyada honi chahiye!";
                return false;
            }

            // 🔍 AI स्कैन 3: फाइल टाइप की सुरक्षा जांच
            if (fileInput) {
                const allowedExtensions = ['image/jpeg', 'image/png', 'image/jpg'];
                if (!allowedExtensions.includes(fileInput.type)) {
                    shieldBox.innerHTML = "⚠️ <b>AI File Block:</b> Sirf asli Photo (.jpg, .png) upload karne ki ijazat hai!";
                    return false;
                }
            }

            // 🟢 सब कुछ पास होने पर AI की हरी झंडी
            shieldBox.className = "ai-status-box ai-success";
            shieldBox.innerHTML = "🤖 <b>Saddam AI Smart Guard Verified!</b> Sabhi jankari surakshit hai. WhatsApp par data bhej rahe hain...";

            // डेटा को सद्दाम भाई के पर्सनल व्हाट्सएप पर भेजना
            setTimeout(() => {
                const myWhatsAppNumber = "917606829390"; 
                const textMessage = `🏪 *NEW VENDOR COIN STORE REQUEST* 🏪\n\n` +
                                    `👤 *Seller Name:* ${document.getElementById('sellerName').value}\n` +
                                    `📱 *Seller WhatsApp:* ${document.getElementById('sellerPhone').value}\n\n` +
                                    `🪙 *COIN DETAILS:* \n` +
                                    `• *Coin Name:* ${document.getElementById('coinName').value}\n` +
                                    `• *Year:* ${document.getElementById('coinYear').value}\n` +
                                    `• *Mint Mark:* ${document.getElementById('coinMint').value}\n` +
                                    `• *Condition:* ${document.getElementById('coinCondition').value}\n` +
                                    `• *Rarity:* ${document.getElementById('coinRarity').value}\n` +
                                    `• *Price:* ₹${price}\n\n` +
                                    `📝 *Description:* ${document.getElementById('coinDesc').value}\n\n` +
                                    `🤖 _Saddam Bhai, AI ne verification complete kar diya hai. Seller ki photo aur details check karke live karein!_`;
                
                window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(textMessage)}`, '_blank');
            }, 1200);

            return true;
        }
    </script>
</body>
</html>
